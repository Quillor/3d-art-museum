<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Image QA contact sheet</title>
<style>
  body { background: #111; color: #ddd; font: 11px/1.3 sans-serif; margin: 10px; }
  .grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; }
  .cell { background: #1c1c1c; padding: 4px; }
  .cell img { width: 100%; height: 110px; object-fit: contain; background: #000; }
  .cell .id { color: #e8c069; font-weight: 700; }
</style>
</head>
<body>
<div class="grid" id="grid"></div>
<script type="module">
import { ALL_ARTWORKS } from "../js/data/artworks.js";
import { IMAGE_URLS } from "../js/data/imageUrls.js";
const grid = document.getElementById("grid");
const queue = [];
for (const a of ALL_ARTWORKS) {
  const url = IMAGE_URLS[a.id] || "";
  const div = document.createElement("div");
  div.className = "cell";
  const img = document.createElement("img");
  div.appendChild(img);
  div.insertAdjacentHTML("beforeend",
    `<div class="id">${a.id}</div><div>${a.title.slice(0, 46)}</div>`);
  grid.appendChild(div);
  queue.push({ img, url, tries: 0 });
}
let active = 0;
window.__pending = queue.length;
function pump() {
  while (active < 5 && queue.length) {
    const job = queue.shift();
    active++;
    job.img.onload = () => { active--; window.__pending--; pump(); };
    job.img.onerror = () => {
      active--;
      if (++job.tries < 3) setTimeout(() => { queue.push(job); pump(); }, 4000);
      else { window.__pending--; job.img.style.background = "#701818"; }
      pump();
    };
    job.img.src = job.url;
  }
}
pump();
</script>
</body>
</html>
