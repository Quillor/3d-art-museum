<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entity Graph — 3D Art Museum</title>
<meta name="description" content="Explorable 3D graph of the museum codebase: modules, data files, domain concepts and their relationships.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕸️</text></svg>">
<style>
  :root {
    --bg: #0d0f14; --panel: rgba(17, 20, 28, 0.92); --line: #262b38;
    --text: #d6dae4; --dim: #8a92a6; --accent: #4cc3e8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); }
  #scene { position: fixed; inset: 0; display: block; }

  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

  /* ---- left: title, search, filters, legend ---- */
  #side { left: 14px; top: 14px; width: 252px; max-height: calc(100vh - 28px);
    overflow-y: auto; padding: 14px 14px 10px; }
  #side h1 { font-size: 15px; margin: 0 0 2px; font-weight: 650; letter-spacing: 0.2px; }
  #side .sub { color: var(--dim); font-size: 11.5px; margin: 0 0 10px; }
  #search { width: 100%; padding: 7px 9px; border-radius: 7px; border: 1px solid var(--line);
    background: #0a0c11; color: var(--text); font: inherit; outline: none; }
  #search:focus { border-color: var(--accent); }
  #search-results { margin: 4px 0 0; padding: 0; list-style: none; max-height: 218px; overflow-y: auto; }
  #search-results li { display: flex; align-items: center; gap: 7px; padding: 5px 7px;
    border-radius: 6px; cursor: pointer; }
  #search-results li:hover, #search-results li.active { background: #1c2230; }
  #search-results .cat { margin-left: auto; color: var(--dim); font-size: 10.5px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .swatch { width: 16px; height: 3px; border-radius: 2px; flex: none; }
  .fgroup { margin-top: 12px; }
  .fgroup h2 { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--dim); margin: 0 0 5px; font-weight: 600; }
  .fgroup label { display: flex; align-items: center; gap: 7px; padding: 3px 2px;
    cursor: pointer; user-select: none; }
  .fgroup label:hover { color: #fff; }
  .fgroup input { accent-color: var(--accent); margin: 0; }
  .fgroup .n { color: var(--dim); margin-left: auto; font-size: 11px; }
  #reset-view { margin-top: 12px; width: 100%; padding: 7px 0; border-radius: 7px;
    border: 1px solid var(--line); background: #182030; color: var(--text); font: inherit;
    cursor: pointer; }
  #reset-view:hover { border-color: var(--accent); color: #fff; }
  #help { margin-top: 10px; color: var(--dim); font-size: 11px; border-top: 1px solid var(--line);
    padding-top: 8px; }
  #help b { color: var(--text); font-weight: 600; }

  /* ---- right: node info ---- */
  #info { right: 14px; top: 14px; width: 296px; max-height: calc(100vh - 28px);
    overflow-y: auto; padding: 14px; display: none; }
  #info.open { display: block; }
  #info-close { position: absolute; top: 6px; right: 9px; background: none; border: none;
    color: var(--dim); font-size: 18px; cursor: pointer; }
  #info-close:hover { color: #fff; }
  #info h2 { font-size: 15px; margin: 0 24px 6px 0; }
  .chip { display: inline-block; font-size: 10.5px; padding: 2px 8px; border-radius: 99px;
    color: #0d0f14; font-weight: 650; margin-right: 6px; }
  #info-path { color: var(--dim); font-size: 11.5px; margin: 7px 0 0; word-break: break-all;
    font-family: ui-monospace, Menlo, monospace; }
  #info-desc { margin: 9px 0 0; color: var(--text); }
  #info-rels h3 { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--dim); margin: 14px 0 4px; font-weight: 600; }
  .rel { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 6px;
    cursor: pointer; }
  .rel:hover { background: #1c2230; }
  .rel .rtype { font-size: 10.5px; width: 66px; flex: none; text-align: right; }
  .rel .rlabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---- tooltip + status ---- */
  #tip { position: fixed; pointer-events: none; background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; font-size: 12px;
    display: none; z-index: 5; max-width: 300px; }
  #tip .t-cat { color: var(--dim); font-size: 10.5px; }
  #status { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    color: var(--dim); font-size: 11.5px; padding: 5px 14px; border-radius: 99px;
    background: var(--panel); border: 1px solid var(--line); transition: opacity 0.6s;
    pointer-events: none; }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<aside id="side" class="panel">
  <h1>Entity Graph</h1>
  <p class="sub">3d-art-museum — modules, data, concepts &amp; how they connect</p>
  <input id="search" type="search" placeholder="Search nodes…  ( / )" autocomplete="off" spellcheck="false">
  <ul id="search-results"></ul>
  <div class="fgroup" id="filter-cats"><h2>Nodes</h2></div>
  <div class="fgroup" id="filter-edges"><h2>Relationships</h2></div>
  <button id="reset-view">Reset view</button>
  <div id="help">
    <b>Drag</b> orbit · <b>right-drag / shift-drag</b> pan · <b>scroll</b> zoom<br>
    <b>W A S D</b> fly · <b>E / Q</b> up / down · <b>shift</b> faster<br>
    <b>click</b> inspect · <b>double-click</b> fly to node
  </div>
</aside>

<aside id="info" class="panel">
  <button id="info-close" aria-label="Close">×</button>
  <h2 id="info-title"></h2>
  <div><span class="chip" id="info-cat"></span><span id="info-deg" style="color:var(--dim);font-size:11.5px"></span></div>
  <div id="info-path"></div>
  <p id="info-desc"></p>
  <div id="info-rels"></div>
</aside>

<div id="tip"></div>
<div id="status">settling layout…</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="main.js"></script>
</body>
</html>
